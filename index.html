<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./images/Rajakarunganj.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rajakarungan j Portfolio</title>
  <meta name="description" content="Professional portfolio of Rajakarungan j - Full Stack Developer " />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('portfolio-theme');
        var isDark = stored ? stored === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
        if (isDark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
